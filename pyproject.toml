[project]
name = "lab-mcp"
version = "0.1.0"
description = "MCP server for laboratory instruments"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "mcp (>=2.3,<3)",
    "pydantic (>=2.14,<3)",
    "pyvisa (>=1.16,<2)",
    "pyvisa-py (>=0.8,<1)",
    # VXI-11 broadcast on all network interfaces, and the LAN scan fallback
    "psutil (>=7)",
    # USB-TMC; libusb-package contains the libusb library, so no system install is necessary
    "pyusb (>=1.3)",
    "libusb-package (>=1.0.26)",
    # Manson HCS power supplies (USB virtual COM port)
    "pyserial (>=3.5)",
]

[project.scripts]
lab-mcp = "lab_mcp.server:main"

[tool.poetry]
packages = [{ include = "lab_mcp", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=9.1"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
